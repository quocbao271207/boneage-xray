[project]
name = "boneage-xray"
version = "0.1.0"
description = "Leakage-safe bone-age X-ray research pipeline with hospital validation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch",
    "torchvision",
    "timm",
    "pandas",
    "pillow",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "opencv-python-headless",
    "pyarrow",
    "pyyaml",
    "pydicom>=3.0.2",
    "pyjpegls>=1.5.1",
    "pypdf>=6.19.0",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
